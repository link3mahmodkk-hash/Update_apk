name: Build Pars Ping Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign Pars Ping APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./gradlew || chmod +x android/gradlew || true

      - name: Run Unit Tests
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew testDebugUnitTest --no-daemon
          elif [ -f "./android/gradlew" ]; then
            cd android && ./gradlew testDebugUnitTest --no-daemon
          fi

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          elif [ -f "./android/gradlew" ]; then
            cd android && ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Locate Generated APK
        id: apk_finder
        run: |
          APK_PATH=$(find . -name "*.apk" -type f | head -n 1)
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload Pars Ping APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ParsPing-VPN-Debug-APK
          path: |
            **/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/release/*.apk
          retention-days: 14
